<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée | Vision Tech</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #020617; color: white; }
        .text-gradient {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="text-center max-w-lg animate-fade-in">
        <h1 class="text-9xl font-black text-white/10 mb-[-2rem] leading-none">404</h1>
        <div class="glass-card p-12 rounded-3xl relative z-10 border-white/5">
            <div class="w-20 h-20 bg-amber-500/10 flex items-center justify-center rounded-2xl mx-auto mb-8">
                <i class="fas fa-exclamation-triangle text-amber-500 text-3xl"></i>
            </div>
            <h2 class="text-3xl font-black mb-4" style="font-family: 'Syne', sans-serif;">OUPS ! <span class="text-gradient">PAGE PERDUE.</span></h2>
            <p class="text-slate-400 mb-10 leading-relaxed">
                Désolé, la page que vous recherchez semble avoir disparu dans le circuit. Redirection immédiate vers l'accueil.
            </p>
            <a href="index.html" class="inline-block bg-amber-500 hover:bg-amber-400 text-slate-900 font-black px-10 py-4 rounded-xl transition-all transform hover:scale-105 active:scale-95 shadow-xl shadow-amber-500/20">
                RETOURNER À L'ACCUEIL
            </a>
        </div>
    </div>
</body>

</html>
